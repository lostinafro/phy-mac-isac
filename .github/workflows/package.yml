name: Package

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build twine
      - run: python -m compileall -q src/phy_mac_isac
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check wheel layout and data
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              paths = archive.namelist()
              assert "phy_mac_isac/__init__.py" in paths
              assert "phy_mac_isac/semantic_isac/scenario.py" in paths              
              assert "phy_mac_isac/anomaly_tracking/scenario.py" in paths
          PY

  anomaly-phy:
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install 'torch>=2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run real Sionna CPU integration tests
        run: python -m unittest discover -s tests/integration -v

