[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phy-mac-isac"
version = "0.0.2"
description = "Physical and MAC layer simulation tools for integrated sensing and communications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fabio Saggese"}]
keywords = ["ISAC", "wireless", "simulation", "Sionna"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "filelock>=3.13.0",
    "GPUtil>=1.4.0",
    "matplotlib>=3.10.8",
    "mitsuba>=3.7.1",
    "numpy>=2.2.6",
    "nvidia-ml-py>=12.535.108",
    "pandas>=2.2.2",
    "rtree>=1.2.0",
    "scipy>=1.15.3",
    "shapely>=2.0.6",
    "sionna>=2.0.0",
    "sionna-rt>=2.0.0",
    "torch>=2.9.1",
    "tqdm>=4.66.1",
    "trimesh>=4.4.0",
]

[project.urls]
Repository = "https://github.com/lostinafro/phy-mac-isac"
Documentation = "https://github.com/lostinafro/phy-mac-isac/blob/develop/docs/usage.md"
Issues = "https://github.com/lostinafro/phy-mac-isac/issues"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["phy_mac_isac*"]

[tool.setuptools.package-data]
"phy_mac_isac" = ["scenes/meshes/*.ply"]
"phy_mac_isac.semantic_isac" = ["rm/*.npz"]
